  <div id="jadeLightbox" onclick="if(event.target === this) closeJadeImg()" style="display:none; position:fixed; inset:0; background:rgba(5,4,8,0.94); z-index:99999; justify-content:center; align-items:center; padding:20px;">
    <button type="button" class="lb-close" onclick="closeJadeImg()">✕ Close</button>
    <button type="button" class="lb-nav-btn lb-prev" onclick="changeJadeImg(-1)" title="Previous">❮</button>
    <img id="jadeLightboxImg" src="" alt="Enlarged Offer" style="max-width:86vw; max-height:86vh; border:2.5px solid #ffcc00; border-radius:12px; box-shadow:0 0 35px rgba(168,85,247,0.85); cursor:default;">
    <button type="button" class="lb-nav-btn lb-next" onclick="changeJadeImg(1)" title="Next">❯</button>
    <div id="jadeLightboxCounter" class="lb-counter">1 / 11</div>
  </div>
  <script>
    var jadeImagesList = [];
    var currentJadeIdx = 0;

    function refreshJadeList() {
      jadeImagesList = [];
      var imgs = document.querySelectorAll('.jade-card img');
      imgs.forEach(function(el) {
        jadeImagesList.push(el.getAttribute('src'));
      });
    }

    function openJadeImg(src) {
      refreshJadeList();
      currentJadeIdx = jadeImagesList.indexOf(src);
      if (currentJadeIdx === -1) currentJadeIdx = 0;
      updateJadeModal();
      document.getElementById('jadeLightbox').style.display = 'flex';
    }

    function changeJadeImg(step) {
      if (jadeImagesList.length === 0) refreshJadeList();
      currentJadeIdx = (currentJadeIdx + step + jadeImagesList.length) % jadeImagesList.length;
      updateJadeModal();
    }

    function updateJadeModal() {
      var img = document.getElementById('jadeLightboxImg');
      var cnt = document.getElementById('jadeLightboxCounter');
      if (img && jadeImagesList.length > 0) {
        img.src = jadeImagesList[currentJadeIdx];
      }
      if (cnt && jadeImagesList.length > 0) {
        cnt.innerText = (currentJadeIdx + 1) + ' / ' + jadeImagesList.length;
      }
    }

    function closeJadeImg() {
      var lb = document.getElementById('jadeLightbox');
      if (lb) lb.style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
      var lb = document.getElementById('jadeLightbox');
      if (!lb || lb.style.display !== 'flex') return;
      if (e.key === 'Escape') closeJadeImg();
      if (e.key === 'ArrowRight') changeJadeImg(1);
      if (e.key === 'ArrowLeft') changeJadeImg(-1);
    });
  </script>

</body>
</html>
